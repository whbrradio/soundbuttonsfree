<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🕹️ My Epic Soundboard</title>
    <style>
        /* Fun arcade-style theme */
        body {
            background-color: #1a1a2e;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 3rem;
            color: #00f2fe;
            text-shadow: 0 0 10px #00f2fe;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #ecc94b;
            margin-bottom: 40px;
        }

        /* The grid holding our sound cards */
        .soundboard-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Individual sound box */
        .sound-card {
            background: #16213e;
            border: 3px solid #4f46e5;
            border-radius: 15px;
            padding: 20px;
            width: 160px;
            box-shadow: 0 8px 0 #312e81;
            transition: all 0.1s ease;
        }

        /* The physical push button */
        .push-button {
            display: inline-block;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            outline: none;
            margin-bottom: 15px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        /* Button Colors */
        .btn-red { background: #ff4757; border: 4px solid #ff6b81; }
        .btn-green { background: #2ed573; border: 4px solid #7bed9f; }
        .btn-blue { background: #1e90ff; border: 4px solid #70a1ff; }

        /* Physical click effect */
        .push-button:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.4);
        }

        .sound-title {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        /* Fun download link */
        .download-link {
            display: block;
            color: #00f2fe;
            text-decoration: none;
            font-size: 0.85rem;
            margin-top: 10px;
        }
        .download-link:hover {
            text-decoration: underline;
            color: #fff;
        }
    </style>
</head>
<body>

    <h1>🕹️ ARCADE SOUNDBOARD</h1>
    <p class="subtitle">Push to play! Click download to keep it!</p>

    <div class="soundboard-grid">

        <!-- SOUND 1 -->
        <div class="sound-card">
            <!-- Audio tag holds the actual sound file -->
            <audio id="laser-sound" src="sounds/laser.mp3"></audio>
            <!-- Clicking this physical button plays the audio ID linked above -->
            <button class="push-button btn-red" onclick="document.getElementById('laser-sound').play()"></button>
            <div class="sound-title">Laser</div>
            <a href="sounds/laser.mp3" download="Laser_Effect.mp3" class="download-link">💾 Download</a>
        </div>

        <!-- SOUND 2 -->
        <div class="sound-card">
            <audio id="boom-sound" src="sounds/boom.mp3"></audio>
            <button class="push-button btn-green" onclick="document.getElementById('boom-sound').play()"></button>
            <div class="sound-title">Explosion</div>
            <a href="sounds/boom.mp3" download="Explosion_Effect.mp3" class="download-link">💾 Download</a>
        </div>

        <!-- SOUND 3 -->
        <div class="sound-card">
            <audio id="coin-sound" src="sounds/coin.mp3"></audio>
            <button class="push-button btn-blue" onclick="document.getElementById('coin-sound').play()"></button>
            <div class="sound-title">Coin Up</div>
            <a href="sounds/coin.mp3" download="Coin_Effect.mp3" class="download-link">💾 Download</a>
        </div>

    </div>

</body>
</html>
