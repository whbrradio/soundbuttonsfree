        .sound-card {

            border: 3px solid #4f46e5;

            padding: 20px;

            border: none;
            cursor: pointer;
            box-shadow: 0 8px 0 rgba(0,0,0,0.4);
            transition: transform 0.1s, box-shadow 0.1s;
            margin-bottom: 15px;
        }
        .push-button:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.4);

        .btn-2 { background: #1e90ff; border: 4px solid #70a1ff; } /* Blue */

            font-size: 1rem;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
