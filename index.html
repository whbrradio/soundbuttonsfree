<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🕹️ Arcade Soundboard</title>
    <style>
        /* Retro Arcade Styling */
        body {
            background-color: #1a1a2e;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        h1 {
            font-size: 3rem;
            color: #00f2fe;
            text-shadow: 0 0 10px #00f2fe;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #ecc94b;
            margin-bottom: 40px;
        }
        .soundboard-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            max-width: 900px;
            margin: 0 auto;
        }
        .sound-card {
            background: #16213e;
            border: 3px solid #4f46e5;
            border-radius: 15px;
            padding: 20px;
            width: 160px;
            box-shadow: 0 8px 0 #312e81;
            transition: all 0.1s ease;
        }
        .push-button {
            display: inline-block;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 0 rgba(0,0,0,0.4);
            transition: transform 0.1s, box-shadow 0.1s;
            margin-bottom: 15px;
        }
        .push-button:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.4);
        }
        /* Arcade Colors */
        .btn-red { background: #ff4757; border: 4px solid #ff6b81; }
        .btn-green { background: #2ed573; border: 4px solid #7bed9f; }
        .btn-blue { background: #1e90ff; border: 4px solid #70a1ff; }
        .btn-yellow { background: #ffa502; border: 4px solid #eccc68; }

        .sound-title {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }
        .download-link {
            display: inline-block;
            background-color: #222;
            color: #00f2fe;
            text-decoration: none;
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 5px;
            border: 1px solid #4f46e5;
            margin-top: 10px;
            transition: 0.2s;
        }
        .download-link:hover {
            background-color: #00f2fe;
            color: #1a1a2e;
        }
    </style>
    <script>
        function playSound(id) {
            let sound = document.getElementById(id);
            sound.currentTime = 0; 
            sound.play();
        }
    </script>
</head>
<body>

    <h1>🕹️ ARCADE SOUNDBOARD</h1>
    <p class="subtitle">Push to play! Click download to keep the file!</p>

    <div class="soundboard-grid">

        <!-- CARD 1 -->
        <div class="sound-card">
            <!-- No 'soundfx/' needed in the src anymore! -->
            <audio id="snd-laser" src="laser.mp3"></audio>
            <button class="push-button btn-red" onclick="playSound('snd-laser')"></button>
            <div class="sound-title">Laser</div>
            <a href="laser.mp3" download="Laser.mp3" class="download-link">💾 Download</a>
        </div>

        <!-- CARD 2 -->
        <div class="sound-card">
            <audio id="snd-explosion" src="explosion.mp3"></audio>
            <button class="push-button btn-green" onclick="playSound('snd-explosion')"></button>
            <div class="sound-title">Explosion</div>
            <a href="explosion.mp3" download="Explosion.mp3" class="download-link">💾 Download</a>
        </div>

        <!-- CARD 3 -->
        <div class="sound-card">
            <audio id="snd-coin" src="coin.mp3"></audio>
            <button class="push-button btn-blue" onclick="playSound('snd-coin')"></button>
            <div class="sound-title">Coin</div>
            <a href="coin.mp3" download="Coin.mp3" class="download-link">💾 Download</a>
        </div>

    </div>

</body>
</html>
